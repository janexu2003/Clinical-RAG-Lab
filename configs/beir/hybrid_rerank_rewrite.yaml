# + LLM query rewriting (costs 1 LLM call per query)
name: hybrid_rerank_rewrite
retrieval: {retrievers: [bm25, dense], dense_model: sentence-transformers/all-MiniLM-L6-v2, fetch_k: 100, k: 10}
rerank: {type: cross_encoder, model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 100}
query: {corpus_description: "a collection of medical and nutrition research documents (titles and abstracts)", transforms: [rewrite]}
generation: {llm: "openai:gpt-4o-mini"}
