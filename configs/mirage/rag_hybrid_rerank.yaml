# Hybrid BM25 + dense. Embedding ~126k snippets takes a while on CPU the first time
# (cached afterwards in .cache/). Try BM25 configs first.
name: rag_hybrid_rerank
mirage: {mode: rag, prompt: rag}
retrieval: {retrievers: [bm25, dense], dense_model: sentence-transformers/all-MiniLM-L6-v2, fetch_k: 30, k: 8}
rerank: {type: cross_encoder, model: cross-encoder/ms-marco-MiniLM-L-6-v2, top_n: 30}
generation: {llm: "openai:gpt-4o-mini"}
